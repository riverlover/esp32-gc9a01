[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
board_build.partitions = huge_app.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
  +<*>
  -<ble_prov_main.cpp>
  -<vendor/>
lib_deps =
  moononournation/GFX Library for Arduino@1.4.7
  ricmoo/QRCode@0.0.1

; Minimal BLE WiFiProv only — no watch face / Canvas / hotspot path.
; Flash: pio run -e ble-wifiprov-min -t upload
; Ignore ricmoo/QRCode so WiFiProv sees ESP-IDF qrcode.h (esp_qrcode_*), not a name clash.
; Screen QR uses vendored copy under src/vendor/ricmoo_qrcode/ (not named bare qrcode.h on -I).
[env:ble-wifiprov-min]
extends = env:esp32-c3-supermini
build_flags =
  ${env:esp32-c3-supermini.build_flags}
  -DPROV_SERVICE_NAME=\"PROV_GC9A01\"
  -DPROV_POP=\"12345678\"
build_src_filter =
  +<ble_prov_main.cpp>
  +<vendor/ricmoo_qrcode/qrcode.c>
lib_ignore =
  QRCode
